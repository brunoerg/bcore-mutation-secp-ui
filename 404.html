<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Store the full path and hash
      sessionStorage.redirect = window.location.pathname + window.location.hash;
      
      // Redirect to the root
      window.location.replace('/');
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
